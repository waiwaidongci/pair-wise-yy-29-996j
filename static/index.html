<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字凭证服务</title>
<style>body{font:16px system-ui;max-width:1100px;margin:32px auto;padding:0 20px}pre{background:#f3f5f7;padding:16px;overflow:auto}button{padding:8px 14px}code{background:#eef1f4;padding:1px 5px;border-radius:4px}</style>
<h1>数字凭证签发与验证</h1>
<p>模板按代号管理多个版本：修订时只有字段或有效期变化才产生新版本；新签发使用当前版本，旧凭证始终按签发时那版出示和验证。状态中的 <code>current_version</code>、每版 <code>changes</code> 以及凭证的 <code>template_version</code> 分别表示模板当前版本、版本间字段变化和凭证所属版本。身份由 <code>X-Actor</code> 与 <code>X-Role</code> 请求头模拟。</p>
<p><button onclick="loadState()">刷新状态</button></p><pre id="state">加载中...</pre>
<script>async function loadState(){state.textContent=JSON.stringify(await (await fetch('/api/state')).json(),null,2)}loadState()</script>
</html>
